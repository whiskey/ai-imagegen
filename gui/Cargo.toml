[package]
name = "ai-imagegen-gui"
version = "0.1.0"
edition = "2021"
description = "Minimal cross-platform desktop front-end for the local MFLUX image generator"

[dependencies]
# eframe re-exports egui; one dep gives us window + widgets + rendering.
eframe = "0.29"
# PNG for our own renders; JPEG/WebP so a dropped-in reference image can be
# previewed too. Still no encoders — we only ever decode.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
# Native file picker for choosing reference images (AppKit panel on macOS).
rfd = "0.15"
# Reading the generation record mflux embeds in each PNG (see render_metadata).
serde_json = "1"

# killpg(2) for the Abort button: `generate.sh` runs mflux as a *child*, so a
# render is only really stopped by signalling the whole process group. Already
# in the tree via eframe/rfd, so this costs no extra build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
