[package]
name = "ai-imagegen-gui"
version = "0.1.0"
edition = "2021"
description = "Minimal cross-platform desktop front-end for the local MFLUX image generator"

[dependencies]
# eframe re-exports egui; one dep gives us window + widgets + rendering.
eframe = "0.29"
# Only need PNG decoding (generate.sh writes .png); trim the rest to keep it light.
image = { version = "0.25", default-features = false, features = ["png"] }
